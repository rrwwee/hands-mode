<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An experimental, browser-based pointing interface using MediaPipe hand landmarks and local user calibration."
    />
    <meta name="theme-color" content="#050608" />
    <title>Hands Mode — Geometry Pointer Prototype</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Hands Mode geometry pointer prototype">
      <section class="stage" aria-label="Estimated pointing location">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay" tabindex="0" aria-label="Pointing area. Press Space to capture during calibration."></canvas>

        <div class="hud">
          <h1>Hands Mode</h1>
          <dl>
            <div>
              <dt>Hands</dt>
              <dd id="hand-count">0</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd id="pointing-state">Loading</dd>
            </div>
            <div>
              <dt>Confidence</dt>
              <dd id="confidence">0%</dd>
            </div>
            <div>
              <dt>Samples</dt>
              <dd id="sample-count">0</dd>
            </div>
            <div>
              <dt>Fit Error</dt>
              <dd id="fit-error">n/a</dd>
            </div>
            <div>
              <dt>Coverage</dt>
              <dd id="coverage">0/25</dd>
            </div>
          </dl>
          <div class="controls">
            <button id="calibration-toggle" type="button">Start Calibration</button>
            <button id="capture-sample" type="button" disabled>Capture Sample</button>
            <button id="undo-sample" type="button" disabled>Undo Pending</button>
            <button id="clear-calibration" type="button">Clear Pending</button>
            <button id="copy-diagnostics" type="button">Copy Diagnostics</button>
            <button id="reset-calibration" class="danger" type="button">
              Reset &amp; Start Over
            </button>
          </div>
        </div>

        <div id="status" class="status" role="status" aria-live="polite">
          Loading hand tracker. Webcam access is needed; frames are processed locally.
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
