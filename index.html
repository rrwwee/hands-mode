<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometry Pointer Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Geometry pointer prototype">
      <section class="stage" aria-label="Estimated pointing location">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>

        <div class="hud">
          <h1>Geometry Pointer</h1>
          <dl>
            <div>
              <dt>Hands</dt>
              <dd id="hand-count">0</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd id="pointing-state">Loading</dd>
            </div>
            <div>
              <dt>Confidence</dt>
              <dd id="confidence">0%</dd>
            </div>
            <div>
              <dt>Samples</dt>
              <dd id="sample-count">0</dd>
            </div>
            <div>
              <dt>Fit Error</dt>
              <dd id="fit-error">n/a</dd>
            </div>
            <div>
              <dt>Coverage</dt>
              <dd id="coverage">0/25</dd>
            </div>
          </dl>
          <div class="controls">
            <button id="calibration-toggle" type="button">Start Calibration</button>
            <button id="capture-sample" type="button">Capture Sample</button>
            <button id="undo-sample" type="button">Undo</button>
            <button id="clear-calibration" type="button">Clear Pending</button>
            <button id="copy-diagnostics" type="button">Copy Diagnostics</button>
          </div>
        </div>

        <div id="status" class="status">Loading hand tracker...</div>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
